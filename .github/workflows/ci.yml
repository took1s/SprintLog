name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend (build, EF check, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore SprintLog.sln

      - name: Build
        run: dotnet build SprintLog.sln --no-restore -c Release

      - name: EF model matches migrations
        working-directory: SprintLog.Api
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --no-build --configuration Release

      - name: Test (Testcontainers / PostgreSQL)
        run: dotnet test SprintLog.sln --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Test summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          for path in glob.glob("TestResults/**/*.trx", recursive=True):
              root = ET.parse(path).getroot()
              c = root.find("t:ResultSummary/t:Counters", ns).attrib
              print(f"::notice title=Tests::total={c['total']} passed={c['passed']} failed={c['failed']}")
              for r in root.iterfind(".//t:UnitTestResult", ns):
                  if r.get("outcome") == "Failed":
                      msg = r.find(".//t:Message", ns)
                      text = (msg.text or "") if msg is not None else ""
                      text = text[:900].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      print(f"::error title={r.get('testName')[:120]}::{text}")
          PY

  frontend:
    name: Frontend (build check, unit + E2E tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build CSS + vendor files
        run: npm run build

      - name: Committed build output is up to date
        run: git diff --exit-code -- SprintLog.Api/wwwroot || (echo "::error::Run 'npm run build' and commit the result." && exit 1)

      - name: Unit tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests (mock API)
        run: npm run test:e2e

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t sprintlog-api:ci .

  ef-script:
    # Erzeugt database/migrate.sql (idempotentes SQL für den Supabase-SQL-Editor) und committet es.
    # Auslösen mit "[ef-script]" in der Commit-Nachricht.
    name: Generate idempotent SQL script
    if: contains(github.event.head_commit.message, '[ef-script]')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Generate script
        working-directory: SprintLog.Api
        run: |
          dotnet tool restore
          dotnet ef migrations script --idempotent -o ../database/migrate.sql
      - name: Commit script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/migrate.sql
          git diff --cached --quiet || git commit -m "chore: regenerate database/migrate.sql"
          git push
