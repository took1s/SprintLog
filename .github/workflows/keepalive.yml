name: Keep-alive

# Hält den kostenlosen Render-Service tagsüber wach (Render schläft nach 15 min ohne Anfrage ein,
# der Kaltstart dauert ~1 min) und erzeugt Datenbank-Aktivität, damit Supabase Free nicht pausiert.
#
# Nur 05-21 Uhr UTC (= 6-23 Uhr deutscher Winterzeit): 17 h × 31 Tage ≈ 530 Instanz-Stunden.
# Render Free hat 750 h pro Monat für ALLE Services des Workspaces - rund um die Uhr (744 h)
# bliebe für andere Services nichts übrig. Nachts dauert der erste Aufruf deshalb wieder ~1 min.
# GitHub startet geplante Workflows mit Verzögerung (oft 5-15 min) - daher alle 10 statt 14 min.
on:
  schedule:
    - cron: "*/10 5-21 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      APP_URL: ${{ vars.APP_URL || 'https://sprintlog-api.onrender.com' }}
    steps:
      - name: Ping /health (Kaltstart kann ~1 Minute dauern)
        run: |
          for i in 1 2 3 4 5 6; do
            status=$(curl -s -o body.txt -w "%{http_code}" --max-time 90 "$APP_URL/health" || echo 000)
            echo "Versuch $i: HTTP $status $(cat body.txt 2>/dev/null)"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 30
          done
          echo "::error::$APP_URL/health antwortet nicht mit 200 - Render-Logs und Supabase-Status prüfen."
          exit 1
