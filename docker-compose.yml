version: '3.8'

services:
  sprintlog-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5111:80" # Внутри контейнера .NET обычно слушает 80 порт, наружу пробрасываем 5111
    env_file:
      - .env
    environment:
      - SprintLogApiKey=${SPRINTLOG_API_KEY}
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
    restart: always