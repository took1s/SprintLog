services:
  sprintlog-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5111:80"
    env_file:
      - .env
    environment:
      - SprintLogApiKey=${SPRINTLOG_API_KEY}
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - JWT_SECRET=${JWT_SECRET}
    restart: always